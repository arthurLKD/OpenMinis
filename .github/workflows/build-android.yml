name: Build Android APK (arm64-v8a)

on:
  push:
    branches:
      - feature/openui-support
      - feature/vdisplay-support
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Minis Preview APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Go 1.25
        uses: actions/setup-go@v5
        with:
          go-version: '^1.25'

      - name: Set up Android SDK & NDK
        run: |
          echo "Installing Android Platform 36, Build Tools 35.0.0, NDK r28, CMake 3.22.1..."
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses >/dev/null 2>&1 || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install \
            "platforms;android-36" \
            "build-tools;35.0.0" \
            "ndk;28.0.12433566" \
            "cmake;3.22.1"

          NDK_PATH="$ANDROID_HOME/ndk/28.0.12433566"
          if [ ! -d "$NDK_PATH" ]; then
            NDK_PATH=$(ls -d $ANDROID_HOME/ndk/* 2>/dev/null | sort -V | tail -n 1)
          fi
          echo "Resolved NDK path: $NDK_PATH"
          echo "ANDROID_NDK_HOME=$NDK_PATH" >> $GITHUB_ENV
          echo "ANDROID_NDK_ROOT=$NDK_PATH" >> $GITHUB_ENV

      - name: Set up gomobile
        run: |
          go install golang.org/x/mobile/cmd/gomobile@latest
          gomobile init

      - name: Prepare build configuration
        run: |
          cp src/android/app/provider-customization.properties.example src/android/app/provider-customization.properties

      - name: Build PRoot for Android
        run: |
          chmod +x deps/build_proot.sh
          ./deps/build_proot.sh

      - name: Prepare Android Sandbox Assets
        run: |
          chmod +x scripts/prepare_android_sandbox.sh
          ./scripts/prepare_android_sandbox.sh

      - name: Build rclone .aar
        run: |
          chmod +x deps/build_rclone_android.sh
          ./deps/build_rclone_android.sh
          mkdir -p src/android/app/libs
          cp deps/build/rclone/rclone.aar src/android/app/libs/

      - name: Build Android App (tests and assembleRelease)
        run: |
          cd src/android
          chmod +x gradlew
          if [ "$GITHUB_REF_NAME" = "feature/vdisplay-support" ]; then
            ./gradlew :app:testGithubReleaseUnitTest :app:testStoreReleaseUnitTest --tests '*VDisplay*' --stacktrace
          fi
          for i in 1 2 3; do
            echo "Attempt $i to build Android App..."
            ./gradlew :app:assembleRelease --stacktrace && break || {
              if [ $i -eq 3 ]; then exit 1; fi
              echo "Build failed on attempt $i, retrying in 10s..."
              sleep 10
            }
          done

      - name: Prepare Output APK
        id: prepare_apk
        run: |
          SRC_APK=$(find src/android/app/build/outputs/apk -name "*.apk" | grep -v "unaligned" | head -n 1)
          if [ -z "$SRC_APK" ]; then
            echo "Error: No APK found under build/outputs/apk!" >&2
            exit 1
          fi
          echo "Found APK: $SRC_APK"
          TARGET_APK="src/android/app/build/outputs/apk/MinisApp-${{ github.ref_name == 'feature/vdisplay-support' && 'VDisplay' || 'OpenUI' }}-preview-arm64-v8a.apk"
          cp "$SRC_APK" "$TARGET_APK"
          echo "apk_path=$TARGET_APK" >> $GITHUB_OUTPUT
          echo "apk_name=$(basename "$TARGET_APK")" >> $GITHUB_OUTPUT
          ls -lh "$TARGET_APK"

      - name: Upload APK to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.ref_name == 'feature/vdisplay-support' && 'MinisApp-VDisplay-preview-arm64-v8a' || 'MinisApp-OpenUI-preview-arm64-v8a' }}
          path: ${{ steps.prepare_apk.outputs.apk_path }}
          retention-days: 30

      - name: Create GitHub Release & Upload Asset
        uses: softprops/action-gh-release@v2
        if: success()
        with:
          tag_name: ${{ github.ref_name == 'feature/vdisplay-support' && 'vdisplay-preview' || 'openui-preview' }}-${{ github.run_number }}
          name: "Minis ${{ github.ref_name == 'feature/vdisplay-support' && 'VDisplay' || 'OpenUI' }} Preview (build ${{ github.run_number }})"
          body: |
            ### Minis Preview (arm64-v8a)
            - Branch: `${{ github.ref_name }}`; commit: `${{ github.sha }}`.
            - Release/R8 build with OpenUI retained.
            - Package: `com.openminis.app.preview`; separate from the official application.
            - On `feature/vdisplay-support`: adds a Shizuku-backed virtual display, preview controls and a permission-gated agent CLI.
            - Virtual display compatibility depends on Android version, ROM and target app. Building successfully does not establish device compatibility.
            - Back up important data before updating. Signature compatibility must be verified before installation.
          files: ${{ steps.prepare_apk.outputs.apk_path }}
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
