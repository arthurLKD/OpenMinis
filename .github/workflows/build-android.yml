name: Build Android APK (arm64-v8a)

on:
  push:
    branches:
      - feature/openui-support
      - feature/vdisplay-support
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Minis Preview APK
    runs-on: ubuntu-latest
    # Without an explicit bound GitHub only kills the job at 6h, so a hung unit
    # test would burn the whole allowance and hide the real failure.
    timeout-minutes: 60

    steps:
      - name: Checkout repository (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Go 1.26.x
        uses: actions/setup-go@v5
        with:
          # Pinned to 1.26.x: '^1.25' floats to 1.27.x, where
          # github.com/go-json-experiment/json (an rclone dependency) no longer
          # compiles (undefined: json.SkipFunc) and the rclone .aar build fails.
          go-version: '1.26.x'
          # The Go modules live in deps/rclone-mobile, not at the repo root;
          # without this the cache key never matches and every run re-downloads
          # ~200 modules.
          cache-dependency-path: deps/rclone-mobile/go.sum

      - name: Set up Android SDK & NDK
        run: |
          echo "Installing Android Platform 36, Build Tools 35.0.0, NDK r28, CMake 3.22.1..."
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses >/dev/null 2>&1 || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install \
            "platforms;android-36" \
            "build-tools;35.0.0" \
            "ndk;28.0.12433566" \
            "cmake;3.22.1"

          NDK_PATH="$ANDROID_HOME/ndk/28.0.12433566"
          if [ ! -d "$NDK_PATH" ]; then
            NDK_PATH=$(ls -d $ANDROID_HOME/ndk/* 2>/dev/null | sort -V | tail -n 1)
          fi
          echo "Resolved NDK path: $NDK_PATH"
          echo "ANDROID_NDK_HOME=$NDK_PATH" >> $GITHUB_ENV
          echo "ANDROID_NDK_ROOT=$NDK_PATH" >> $GITHUB_ENV

      - name: Set up gomobile
        run: |
          go install golang.org/x/mobile/cmd/gomobile@latest
          gomobile init

      - name: Prepare build configuration
        run: |
          cp src/android/app/provider-customization.properties.example src/android/app/provider-customization.properties

      - name: Build PRoot for Android
        run: |
          chmod +x deps/build_proot.sh
          ./deps/build_proot.sh

      - name: Prepare Android Sandbox Assets
        run: |
          chmod +x scripts/prepare_android_sandbox.sh
          ./scripts/prepare_android_sandbox.sh

      - name: Build rclone .aar
        run: |
          chmod +x deps/build_rclone_android.sh
          ./deps/build_rclone_android.sh
          mkdir -p src/android/app/libs
          cp deps/build/rclone/rclone.aar src/android/app/libs/

      - name: Cache Gradle caches and wrapper
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('src/android/gradle/wrapper/gradle-wrapper.properties', 'src/android/*.gradle*', 'src/android/gradle/libs.versions.toml') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Run VDisplay unit tests
        if: github.ref_name == 'feature/vdisplay-support'
        # A hung test used to wait for the 6h job ceiling. 20 minutes is far
        # above the observed runtime of the focused VDisplay test classes.
        timeout-minutes: 20
        run: |
          cd src/android
          chmod +x gradlew
          # --tests is a per-task option: Gradle binds it to the task name that
          # immediately precedes it, and a second task name ends that binding.
          # Listing one task here keeps the filter effective; add
          # `--tests '<pattern>'` again after any further task name.
          ./gradlew :app:testGithubReleaseUnitTest --tests '*VDisplay*' --stacktrace
          python3 ../../scripts/verify_vdisplay_test_results.py app/build/test-results/testGithubReleaseUnitTest

      - name: Upload unit test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: |
            src/android/app/build/reports/tests/**
            src/android/app/build/test-results/**
          retention-days: 7
          if-no-files-found: ignore

      - name: Assemble release APK
        # Release/R8 packaging only; a deterministic failure is not worth
        # re-running three times, which tripled the wall clock on real errors.
        timeout-minutes: 35
        run: |
          cd src/android
          chmod +x gradlew
          ./gradlew :app:assembleRelease --stacktrace

      - name: Prepare Output APK
        id: prepare_apk
        run: |
          SRC_APK="src/android/app/build/outputs/apk/github/release/app-github-release.apk"
          if [ ! -f "$SRC_APK" ]; then
            echo "Error: expected APK missing: $SRC_APK" >&2
            ls -R src/android/app/build/outputs/apk 2>/dev/null || true
            exit 1
          fi
          TARGET_APK="src/android/app/build/outputs/apk/MinisApp-${{ github.ref_name == 'feature/vdisplay-support' && 'VDisplay' || 'OpenUI' }}-preview-arm64-v8a.apk"
          cp "$SRC_APK" "$TARGET_APK"
          echo "apk_path=$TARGET_APK" >> $GITHUB_OUTPUT
          echo "apk_name=$(basename "$TARGET_APK")" >> $GITHUB_OUTPUT
          ls -lh "$TARGET_APK"

      - name: Verify APK package, release flags and signature
        env:
          APK: ${{ steps.prepare_apk.outputs.apk_path }}
          EXPECTED_PACKAGE: ${{ github.ref_name == 'feature/vdisplay-support' && 'com.openminis.app.preview.vdisplay' || 'com.openminis.app.preview' }}
        run: |
          set -eu
          BUILD_TOOLS="$ANDROID_HOME/build-tools/35.0.0"
          test -s "$APK"
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$APK"
          BADGING=$("$BUILD_TOOLS/aapt" dump badging "$APK")
          printf '%s\n' "$BADGING" | rg "^package: name='$EXPECTED_PACKAGE' "
          if printf '%s\n' "$BADGING" | rg '^application-debuggable'; then
            echo 'Release APK must not be debuggable' >&2
            exit 1
          fi
          printf '%s\n' "$BADGING" | rg "^native-code: 'arm64-v8a'$"
          sha256sum "$APK"

      - name: Upload APK to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.ref_name == 'feature/vdisplay-support' && 'MinisApp-VDisplay-preview-arm64-v8a' || 'MinisApp-OpenUI-preview-arm64-v8a' }}
          path: ${{ steps.prepare_apk.outputs.apk_path }}
          retention-days: 30

      - name: Create GitHub Release & Upload Asset
        uses: softprops/action-gh-release@v2
        if: success()
        with:
          tag_name: ${{ github.ref_name == 'feature/vdisplay-support' && 'vdisplay-preview' || 'openui-preview' }}-${{ github.run_number }}
          name: "Minis ${{ github.ref_name == 'feature/vdisplay-support' && 'VDisplay' || 'OpenUI' }} Preview (build ${{ github.run_number }})"
          body: |
            ### Minis Preview (arm64-v8a)
            - Branch: `${{ github.ref_name }}`; commit: `${{ github.sha }}`.
            - Release/R8 build with OpenUI retained.
            - Package: `${{ github.ref_name == 'feature/vdisplay-support' && 'com.openminis.app.preview.vdisplay' || 'com.openminis.app.preview' }}`; separate from both the official application and OpenUI preview.
            - On `feature/vdisplay-support`: adds a Shizuku-backed virtual display, preview controls and a permission-gated agent CLI.
            - Virtual display compatibility depends on Android version, ROM and target app. Building successfully does not establish device compatibility.
            - Back up important data before updating. Signature compatibility must be verified before installation.
          files: ${{ steps.prepare_apk.outputs.apk_path }}
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
